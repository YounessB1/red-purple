# ── Experiment ──────────────────────────────────────────────────────────
experiments_dir: experiments
experiment_name: PoC_generalization_Qwen32B_test
splits: PoC_generalization
max_calls: 90
workers: 3

# ── CTF Agent ───────────────────────────────────────────────────────────
ctf_agent:
  # .md  → source/seed/.opencode/agents/ctf-agent.md
  md:
    model: openrouter/qwen/qwen3-32b
    maxSteps: 50
  # runtime
  server_url: http://localhost:8000

# ── Scorer ──────────────────────────────────────────────────────────────
scorer:
  # .md  → .opencode/agents/scorer.md
  md:
    model: openrouter/qwen/qwen3.7-plus
    temperature: 0.1
  # runtime
  gt: true

# ── Diagnoser ───────────────────────────────────────────────────────────
diagnoser:
  # .md  → .opencode/agents/diagnoser.md
  md:
    model: openrouter/qwen/qwen3.7-plus
    temperature: 0.2
    max_tokens: 4000
  # runtime
  gt: true

# ── Reflector ───────────────────────────────────────────────────────────
reflector:
  # .md  → .opencode/agents/<agent>
  md:
    model: openrouter/qwen/qwen3.7-plus
    temperature: 1.0
    top_p: 1.0
  # runtime
  agent: reflector
  agentic: true
  train_minibatch_size: 3
  val_minibatch_size: null
  # edit budget / learning rate
  edit_budget: 1        # max patches applied per reflector step (max_lr)
  min_edit_budget: 1   # floor for cosine/linear decay
  lr_scheduler: cosine  # constant | linear | cosine

# ── Merger ──────────────────────────────────────────────────────────────
merger:
  # .md  → .opencode/agents/<agent>
  md:
    model: openrouter/qwen/qwen3.7-plus
    temperature: 0.1
  # runtime
  agent: merger
  merge_threshold: 0.3
