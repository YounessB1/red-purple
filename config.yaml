# Sequential experiments. main.py runs each top-level config in order.

- experiment_name: split30_think_2
  experiments_dir: experiments
  splits: split30
  max_calls: 5000
  workers: 10

  # ── CTF Agent ─────────────────────────────────────────────────────────
  ctf_agent:
    # .md  → source/seed/.opencode/agents/ctf-agent.md
    md:
      model: polito/gemma-4-31b
      steps: 50
    # runtime
    server_url: http://localhost:8000

  # ── Scorer ────────────────────────────────────────────────────────────
  scorer:
    # .md  → .opencode/agents/scorer.md
    md:
      model: polito/gemma-4-31b
      temperature: 0.1
    # runtime
    gt: true

  # ── Diagnoser ─────────────────────────────────────────────────────────
  diagnoser:
    # .md  → .opencode/agents/diagnoser.md
    md:
      model: polito/gemma-4-31b
      temperature: 0.2
      max_tokens: 4000
    # runtime
    gt: true

  # ── Reflector ─────────────────────────────────────────────────────────
  reflector:
    # .md  → .opencode/agents/<agent>
    md:
      model: openrouter/anthropic/claude-sonnet-5
    # runtime
    agent: reflector
    agentic: true
    train_minibatch_size: 3
    val_minibatch_size: null
    # edit budget / learning rate
    evolution: skill      # prompt | skill — controls what reflector/merger may change
    edit_budget: 20        # max patches applied per reflector step (max_lr) — set high so it never clips (accept all proposed patches)
    min_edit_budget: 20    # floor for cosine/linear decay — irrelevant in constant mode, kept equal for clarity
    lr_scheduler: constant # constant | linear | cosine — constant always returns edit_budget, i.e. accept all

  # ── Merger ────────────────────────────────────────────────────────────
  merger:
    # .md  → .opencode/agents/<agent>
    md:
      model: openrouter/anthropic/claude-sonnet-5
    # runtime
    agent: merger
    merge_threshold: 0.3
